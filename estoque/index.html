<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APP ESTOQUE v1.0 — EMBUTIDOS</title>
<style>
  :root{ --fundo:#f4f4f2; --cartao:#fff; --tinta:#1a1a1a; --cinza:#666;
         --borda:#d8d8d8; --acento:#1F4E79; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:Calibri, Arial, sans-serif; background:var(--fundo);
       color:var(--tinta); font-size:16px;}
  header{position:sticky; top:0; z-index:9; background:#000; color:#fff;
         padding:10px 12px;}
  header h1{margin:0; font-size:17px;}
  header .sub{font-size:12px; color:#bbb; margin-top:2px;}
  .barra{display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px;
         background:#fff; border-bottom:1px solid var(--borda);
         position:sticky; top:57px; z-index:8; align-items:center;}
  .barra label{font-size:13px; color:var(--cinza);}
  .barra input{width:76px; font-size:16px; padding:6px; border:1px solid var(--borda);
               border-radius:6px; text-align:center;}
  button{cursor:pointer; border:0; border-radius:6px; padding:9px 12px;
         font-size:14px; font-weight:bold;}
  .btn-p{background:var(--acento); color:#fff;}
  .btn-s{background:#e8e8e8; color:#222;}
  .btn-mini{padding:4px 8px; font-size:12px; background:#e8e8e8; border-radius:5px;}
  main{padding:10px 12px 90px; max-width:760px; margin:0 auto;}
  .aviso{background:#FFF6D6; border:1px solid #e3c800; border-radius:8px;
         padding:8px 10px; font-size:13px; margin:8px 0; display:none;}
  .sec{background:var(--cartao); border:1px solid var(--borda); border-radius:10px;
       margin:10px 0; overflow:hidden;}
  .sec-t{display:flex; justify-content:space-between; align-items:center;
         padding:10px 12px; background:#EFEFEF; font-weight:bold; cursor:pointer;}
  .sec-t .n{font-size:12px; color:var(--cinza); font-weight:normal;}
  .item{border-top:1px solid var(--borda); padding:8px 12px;}
  .item .nome{font-size:15px; font-weight:bold;}
  .lotes{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .lote{display:flex; gap:4px; align-items:center; background:#F7F7F7;
        border:1px solid var(--borda); border-radius:8px; padding:5px 7px;}
  .lote input{font-size:16px; padding:6px 4px; border:1px solid var(--borda);
              border-radius:5px; text-align:center;}
  .lote .q{width:56px;}
  .lote .d{width:88px;}
  .lote .x{border:0; background:none; color:#c00; font-weight:bold; padding:2px 6px;}
  .chip{display:inline-block; width:12px; height:12px; border-radius:3px;
        margin-left:2px; vertical-align:middle;}
  .rodape{position:fixed; bottom:0; left:0; right:0; background:#fff;
          border-top:1px solid var(--borda); padding:8px 12px; display:flex;
          gap:8px; justify-content:center;}
  .contador{font-size:12px; color:var(--cinza); text-align:center; margin-top:6px;}
</style>
</head>

<div class="aviso" id="avisoModelo"></div>
<main id="lista"></main>
<div class="contador" id="contador"></div>

<div class="rodape">
  <button class="btn-p" style="font-size:16px; padding:12px 18px; background:#25D366" onclick="enviar()">📤 ENVIAR AO ESCRITÓRIO</button>
  <button class="btn-s" style="padding:12px 14px" onclick="salvar()">💾 Salvar</button>
</div>

<script>
const VERSAO_APP = "v1.0";
const CATEGORIA = "EMBUTIDOS";
// Fotografia do MODELO oficial EMB (8 secoes/60 itens) de 16/11.
// Se o cadastro-mestre mudar, carregue o MODELO_APP.json da semana.
const MODELO_EMBUTIDO = [{"grupo": "LINGUIÇA", "itens": ["LINGUIÇA AURORA", "LINGUIÇA FRIELLA", "LINGUIÇA NUTRIBEN", "LINGUIÇA PERDIGÃO NA BRASA", "LINGUIÇA REZENDE", "LINGUIÇA SADIA", "LINGUIÇA SADIA SUINA CHURRASCO", "LINGUIÇA SEARA", "LINGUIÇA SEARA SUINA/CHURRASCO"]}, {"grupo": "CALABRESA", "itens": ["LING CALABRESA AURORA", "LING CALABRESA DONALLI", "LING CALABRESA FRIELA", "LING CALABRESA PERDIGÃO", "LING CALABRESA SADIA", "LING CALABRESA SEARA"]}, {"grupo": "MORTADELA", "itens": ["MORT AURORA", "MORT AURORELLA", "MORT DOM MATEO", "MORT MARBA TRAD", "MORT PERDIGÃO OURO", "MORT PERDIGÃO TRAD", "MORT REZENDE TRAD", "MORT SADIA DEF", "MORT SEARA DEF", "MORT SEARA TRAD"]}, {"grupo": "PRESUNTO", "itens": ["PRESUNTO AURORA", "PRESUNTO PERDIGÃO", "PRESUNTO REZENDE", "PRESUNTO SADIA", "PRESUNTO SEARA"]}, {"grupo": "APRESUNTADO", "itens": ["APRESUNTADO AURORA", "APRESUNTADO PERDIGÃO", "APRESUNTADO REZENDE", "APRESUNTADO SADIA", "APRESUNTADO SEARA"]}, {"grupo": "SALSICHA", "itens": ["SALSICHA AURORA", "SALSICHA DONALI", "SALSICHA NOBRE", "SALSICHA PERDIGAO", "SALSICHA REZENDE", "SALSICHA SADIA", "SALSICHA SEARA", "SALSICHA SEARA S/ CORANTE"]}, {"grupo": "BACON", "itens": ["BACON AURORA", "BACON FRICASA", "BACON PERDIGAO", "BACON QUALIVIP", "BACON SADIA", "BACON SEARA"]}, {"grupo": "EMBUTIDOS", "itens": ["LOMBO DEF AURORA", "PEITO PERU SADIA", "ROSBIFE", "SALAME AURORA", "SALAME AURORA FINO", "SALAME NOBRE", "SALAME PERDIGÃO", "SALAME SADIA ITALIANO", "PEITO DE FRANGO SADIA", "QUEIJO PARMESSAO RALADO PCT 1KG", "QUEIJO PROVOLONE P/FATIAR"]}];
let secoes = MODELO_EMBUTIDO;
let origemModelo = "fotografia embutida (16/11)";

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
function norm(t){return (t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();}

function mesReferencia(){
  const s = $("#semana").value.trim();           // ex.: 1611 -> dia 16, mes 11
  if(/^\d{4}$/.test(s)){ const m = parseInt(s.slice(2,4),10);
    if(m>=1 && m<=12) return m; }
  return (new Date()).getMonth()+1;
}
function anoReferencia(){ return (new Date()).getFullYear(); }

// cores oficiais R4 do processo (mesma tabela do robo v27)
const CORES = {0:"#FF0000",1:"#FFFF00",2:"#0070C0",3:"#00B050"};
function corDaValidade(txt){
  const m = txt.match(/^(\d{2})\/(\d{2})\/(\d{2,4})$/);
  if(!m) return null;
  let ano = parseInt(m[3],10); if(ano<100) ano += 2000;
  const delta = (ano*12 + parseInt(m[2],10)) - (anoReferencia()*12 + mesReferencia());
  if(delta < 0) return "#C00000";               // vencido
  return CORES[Math.min(delta,3)];
}
function mascaraData(inp){
  let v = inp.value.replace(/\D/g,"").slice(0,6);
  if(v.length>4) v = v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4);
  else if(v.length>2) v = v.slice(0,2)+"/"+v.slice(2);
  inp.value = v;
  const chip = inp.parentElement.querySelector(".chip");
  const cor = v.length===8 ? corDaValidade(v) : null;
  chip.style.background = cor || "transparent";
  chip.title = cor ? "" : "";
  rascunho();
}

// ---------- montagem da tela ----------
function montar(){
  const main = $("#lista"); main.innerHTML = "";
  secoes.forEach((sec, si)=>{
    const div = document.createElement("div");
    div.className = "sec";
    div.innerHTML = `<div class="sec-t" onclick="this.nextElementSibling.style.display =
        this.nextElementSibling.style.display==='none'?'block':'none'">
        <span>${sec.grupo}</span><span class="n">${sec.itens.length} itens ▾</span></div>
      <div class="sec-c"></div>`;
    const corpo = div.querySelector(".sec-c");
    sec.itens.forEach((nome, ii)=>{
      const it = document.createElement("div");
      it.className = "item";
      it.innerHTML = `<div class="nome">${sec.itens[ii]}</div>
        <div class="lotes" data-g="${si}" data-i="${ii}"></div>
        <button class="btn-mini" onclick="addLote(${si},${ii})">+ lote</button>`;
      corpo.appendChild(it);
    });
    main.appendChild(div);
  });
  atualizaContador();
  $("#avisoModelo").style.display = "block";
  $("#avisoModelo").innerHTML = "Modelo em uso: <b>" + origemModelo + "</b> — " +
    secoes.length + " seções / " +
    secoes.reduce((a,s)=>a+s.itens.length,0) + " itens. Se o cadastro-mestre " +
    "mudou esta semana, carregue o <b>MODELO_APP.json</b> antes de digitar.";
}
function addLote(si, ii, qtd, data){
  const zona = document.querySelector(`.lotes[data-g="${si}"][data-i="${ii}"]`);
  const d = document.createElement("div");
  d.className = "lote";
  d.innerHTML = `<input class="q" inputmode="numeric" placeholder="qtd"
        value="${qtd||""}" oninput="this.value=this.value.replace(/[^0-9]/g,'');rascunho()">
      <input class="d" inputmode="numeric" placeholder="dd/mm/aa" maxlength="8"
        value="${data||""}" oninput="mascaraData(this)">
      <span class="chip"></span>
      <button class="x" title="remover lote" onclick="this.parentElement.remove();rascunho();atualizaContador()">×</button>`;
  zona.appendChild(d);
  if(data) mascaraData(d.querySelector(".d"));
  atualizaContador();
}
function atualizaContador(){
  const lotes = document.querySelectorAll(".lote").length;
  const preenchidos = [...document.querySelectorAll(".lote .q")]
    .filter(i=>i.value.trim()!=="").length;
  $("#contador").textContent = lotes
    ? `${preenchidos} lote(s) com quantidade, de ${lotes} aberto(s)` : "";
}

// ---------- rascunho automatico (navegador; o oficial e o JSON) ----------
function rascunho(){
  const dados = coletar();
  localStorage.setItem("app-estoque-rascunho", JSON.stringify(dados));
  atualizaContador();
}
function restaurar(){
  const r = localStorage.getItem("app-estoque-rascunho");
  if(!r) return;
  try{
    const d = JSON.parse(r);
    if(d.semana && !$("#semana").value) $("#semana").value = d.semana;
    (d.itens||[]).forEach(it=>{
      const si = secoes.findIndex(s=>s.grupo===it.grupo);
      if(si<0) return;
      const ii = secoes[si].itens.indexOf(it.produto);
      if(ii<0) return;
      (it.lotes||[]).forEach(l=>addLote(si,ii,l.qtd,l.validade));
    });
  }catch(e){}
}

// ---------- coleta e arquivo ----------
function coletar(){
  const itens = [];
  secoes.forEach((sec, si)=>{
    sec.itens.forEach((nome, ii)=>{
      const zona = document.querySelector(`.lotes[data-g="${si}"][data-i="${ii}"]`);
      const lotes = [];
      zona.querySelectorAll(".lote").forEach(l=>{
        const q = l.querySelector(".q").value.trim();
        const d = l.querySelector(".d").value.trim();
        if(q!=="") lotes.push({qtd: parseInt(q,10), validade: d || null});
      });
      if(lotes.length) itens.push({grupo: sec.grupo, produto: nome, lotes});
    });
  });
  return {app:"app-estoque", versao:VERSAO_APP, loja:$("#loja").value,
          categoria:CATEGORIA,
          semana:$("#semana").value.trim(), gerado_em:new Date().toISOString(),
          modelo_origem:origemModelo, itens};
}
const ehCelular = () => window.matchMedia("(pointer:coarse)").matches;
function validar(){
  if(!$("#loja").value){
    alert("Escolha SUA LOJA primeiro — é ela que nomeia o arquivo.");
    $("#loja").focus(); return null;
  }
  if(!/^\d{4}$/.test($("#semana").value.trim())){
    alert("Preencha a SEMANA com 4 números (ex.: 1611 = dia 16, mês 11).");
    $("#semana").focus(); return null;
  }
  const dados = coletar();
  if(!dados.itens.length){ alert("Nada digitado ainda — não vou salvar vazio."); return null; }
  return dados;
}
const nomeBase = d => "ESTOQUE_" + d.loja.normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"_") + "_" + d.semana;
// ENVIAR: no celular abre o compartilhar (WhatsApp). Android so compartilha
// .txt (json e bloqueado pelo Chrome) — o consolidador le os dois.
async function enviar(){
  const dados = validar(); if(!dados) return;
  const base = nomeBase(dados), texto = JSON.stringify(dados, null, 1);
  const arq = new File([texto], base + ".txt", {type:"text/plain"});
  if(ehCelular() && navigator.canShare && navigator.canShare({files:[arq]})){
    try{ await navigator.share({files:[arq], title:base}); return; }
    catch(e){ if(e.name==="AbortError") return; }
  }
  await salvar(dados, true);
}
async function salvar(dadosProntos, veioDoEnviar){
  const dados = dadosProntos || validar(); if(!dados) return;
  const nome = nomeBase(dados) + ".json", texto = JSON.stringify(dados, null, 1);
  const dica = "Agora anexe este arquivo no WhatsApp (📎 → Documento) ou " +
               "WhatsApp Web e envie para o escritório. Ele vai na pasta da semana (ex.: 1611\\EMB).";
  if(window.showSaveFilePicker){                     // computador: grava direto na pasta
    try{
      const h = await showSaveFilePicker({suggestedName:nome,
        types:[{description:"JSON", accept:{"application/json":[".json"]}}]});
      const w = await h.createWritable(); await w.write(texto); await w.close();
      alert("Salvo: " + h.name + "\n\n" + dica); return;
    }catch(e){ if(e.name==="AbortError") return; }
  }
  const a = document.createElement("a");              // celular: download
  a.href = URL.createObjectURL(new Blob([texto],{type:"application/json"}));
  a.download = nome; a.click();
  alert((veioDoEnviar && ehCelular() ? "Este aparelho não abriu o compartilhar direto.\n" : "") +
        "Baixei " + nome + ".\n\n" + dica);
}
function abrirJson(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
      const d = JSON.parse(r.result);
      if(d.app!=="app-estoque"){ alert("Este arquivo não é do APP ESTOQUE."); return; }
      if(d.loja) $("#loja").value = d.loja;
      $("#semana").value = d.semana || "";
      (d.itens||[]).forEach(it=>{
        const si = secoes.findIndex(s=>s.grupo===it.grupo);
        if(si<0) return;
        const ii = secoes[si].itens.indexOf(it.produto);
        if(ii<0) return;
        (it.lotes||[]).forEach(l=>addLote(si,ii,String(l.qtd),l.validade||""));
      });
      alert("Aberto: "+f.name+" ("+d.itens.length+" produtos com estoque)");
    }catch(e){ alert("Não consegui ler este arquivo."); } };
  r.readAsText(f);
  ev.target.value = "";
}
function carregarModelo(){ document.getElementById("abrirModelo").click(); }
function lerModelo(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
      const d = JSON.parse(r.result);
      if(!d.secoes || !Array.isArray(d.secoes)){ throw 0; }
      secoes = d.secoes; origemModelo = f.name;
      montar(); restaurar();
      alert("Modelo carregado: "+f.name);
    }catch(e){ alert("Este arquivo não é um MODELO_APP.json válido."); } };
  r.readAsText(f);
  ev.target.value = "";
}
function limparTudo(){
  if(!confirm("Apagar TUDO o que foi digitado (e o rascunho salvo)?")) return;
  localStorage.removeItem("app-estoque-rascunho");
  document.querySelectorAll(".lote").forEach(l=>l.remove());
  atualizaContador();
}

// semana padrao = hoje (ddmm)
(function(){ const h=new Date();
  $("#semana").value = String(h.getDate()).padStart(2,"0") + String(h.getMonth()+1).padStart(2,"0");
  $("#semana").addEventListener("input", ()=>{ document.querySelectorAll(".lote .d")
    .forEach(i=>{ if(i.value.length===8) mascaraData(i); }); rascunho(); });
  const lj = localStorage.getItem("app-estoque-loja");
  if(lj) $("#loja").value = lj;
  $("#loja").addEventListener("change", ()=>
    localStorage.setItem("app-estoque-loja", $("#loja").value));
  montar(); restaurar();
  // no site (GitHub): se o escritorio publicou um MODELO_APP.json mais novo, usa ele
  if(location.protocol.startsWith("http")){
    fetch("MODELO_APP.json?v=" + Date.now(), {cache:"no-store"})
      .then(r => r.ok ? r.json() : null)
      .then(d => { if(d && Array.isArray(d.secoes) && d.secoes.length){
          secoes = d.secoes; origemModelo = "modelo do site" +
            (d.exportado_em ? " (" + String(d.exportado_em).slice(0,10) + ")" : "");
          montar(); restaurar(); } })
      .catch(()=>{});
  }
})();
</script>
</body>
</html>
